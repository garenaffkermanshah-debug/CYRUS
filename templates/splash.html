<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080d">
<title>CYRUS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #03060b;
  color: #f5d47a;
  font-family: sans-serif;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at center, #102b4b, #03060b 75%);
}

.art {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 5%;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.art.loaded {
  opacity: 1;
}

.loading {
  position: absolute;
  bottom: 8%;
  width: 80%;
  max-width: 360px;
  text-align: center;
  z-index: 2;
}

.track {
  height: 8px;
  background: #ffffff20;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #b58a3b;
}

.bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #087cff, #f5d47a);
  transition: width 0.7s ease;
}

.percent {
  font-size: 13px;
  color: #c5b58d;
  margin-top: 11px;
}

</style>
</head>

<body>
<div class="screen">

  <img
    id="splashImage"
    class="art"
    src="/static/splash.png"
    alt="CYRUS"
  >


  <div class="loading">
    <div class="track">
      <div id="bar" class="bar"></div>
    </div>

    <div id="percent" class="percent">در حال بارگذاری تصویر</div>
  </div>

</div>

<script>
const img = document.getElementById("splashImage");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const totalDuration = 7000;
const startTime = performance.now();

img.onload = () => img.classList.add("loaded");
img.onerror = () => {
  percent.textContent = "تصویر بارگذاری نشد";
};

if (img.complete && img.naturalWidth > 0) {
  img.classList.add("loaded");
}

function update(now) {
  const elapsed = now - startTime;
  const progress = Math.min(100, elapsed / totalDuration * 100);

  bar.style.width = progress + "%";
  percent.textContent = Math.floor(progress).toLocaleString("fa-IR") + "٪";

  if (elapsed < totalDuration) {
    requestAnimationFrame(update);
  } else {
    bar.style.width = "100%";
    percent.textContent = "۱۰۰٪";
    window.location.replace("/welcome");
  }
}

bar.style.width = "0%";
percent.textContent = "۰٪";
requestAnimationFrame(update);
</script>
</body>
</html>
