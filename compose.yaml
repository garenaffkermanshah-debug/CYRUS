services:
  cyrus:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyrus-messenger:latest
    container_name: cyrus-messenger
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      SUPABASE_URL: "${SUPABASE_URL:?Set SUPABASE_URL in .env}"
      SUPABASE_KEY: "${SUPABASE_KEY:?Set SUPABASE_KEY in .env}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','8080')+'/healthz',timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
